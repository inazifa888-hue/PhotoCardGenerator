:root {
  --bg: #f6f5f2; --surface: #ffffff; --fg: #1b1a18; --muted: #6a6560; --line: #e2ded7;
  --rd: #c8102e; --gn: #0f6a37; --tint: #eef4ef; --ink-on: #ffffff;
  --shadow: 0 1px 2px rgba(20,30,20,.06), 0 8px 24px rgba(20,30,20,.07);
  --head: "BornomalaEmbed", "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", sans-serif;
  --body: "Hind Siliguri", "BornomalaEmbed", "Noto Sans Bengali", "Kalpurush", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --surface: #1d1c1a; --fg: #efece7; --muted: #a49f98; --line: #34312d;
    --rd: #ef4a63; --gn: #3fbf7a; --tint: #1a2a21; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --surface: #1d1c1a; --fg: #efece7; --muted: #a49f98; --line: #34312d;
  --rd: #ef4a63; --gn: #3fbf7a; --tint: #1a2a21; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-block: 0 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3, .head { font-family: var(--head); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }

/* top strip + masthead */
.strip { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.strip .tools { display: flex; gap: 8px; align-items: center; }
.strip button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.mast { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 12px; text-align: center; }
.mast a { display: inline-flex; align-items: center; gap: 12px; }
.mast img { width: 56px; height: 56px; border-radius: 50%; display: block; box-shadow: var(--shadow); }
.mast .name { font-family: var(--head); font-weight: 700; font-size: clamp(28px, 6vw, 44px); line-height: 1.1; background: linear-gradient(90deg, var(--rd) 0 45%, var(--gn) 55% 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mast .tag { font-size: 13px; color: var(--muted); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-top: 3px solid var(--rd); border-bottom: 1px solid var(--line); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; align-items: center; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; padding: 9px 12px; font-family: var(--head); font-size: 15px; border-radius: 6px; white-space: nowrap; }
.nav a:hover { background: var(--tint); }
.nav a.on { color: var(--rd); box-shadow: inset 0 -3px 0 var(--rd); border-radius: 0; }
.nav .srch { margin-left: auto; flex: none; display: flex; gap: 6px; padding-left: 8px; }
.nav input { width: 130px; font: inherit; font-size: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.nav input:focus { outline: 2px solid var(--gn); outline-offset: 1px; }

/* breaking ticker */
.ticker { display: flex; align-items: stretch; margin-top: 12px; border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.ticker b { background: var(--rd); color: #fff; padding: 6px 14px; font-family: var(--head); font-size: 14px; flex: none; display: flex; align-items: center; }
.ticker .run { overflow: hidden; flex: 1; min-width: 0; display: flex; align-items: center; }
.ticker .track { display: inline-flex; gap: 40px; white-space: nowrap; padding-left: 100%; animation: tick 40s linear infinite; font-size: 14.5px; }
.ticker .track a:hover { color: var(--rd); }
@keyframes tick { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; padding-left: 12px; } .ticker .run { overflow-x: auto; } }

/* cards */
.pic { position: relative; background: linear-gradient(135deg, var(--c1), var(--c2)); aspect-ratio: 16 / 9; overflow: hidden; display: block; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .ph img.lg { width: auto; height: 42%; max-width: 60%; object-fit: contain; border-radius: 50%; opacity: .92; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.pic .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--head); color: rgba(255,255,255,.9); font-size: clamp(20px, 4vw, 34px); text-shadow: 0 2px 10px rgba(0,0,0,.25); }
.chip { display: inline-block; font-family: var(--head); font-size: 12.5px; color: #fff; background: var(--rd); border-radius: 4px; padding: 1px 9px; }
.meta { font-size: 12.5px; color: var(--muted); }
.section { margin-top: 26px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 2px solid var(--line); }
.sec-h h2 { font-size: 20px; padding: 0 0 6px; position: relative; }
.sec-h h2::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: linear-gradient(90deg, var(--rd), var(--gn)); }
.sec-h a { margin-left: auto; font-size: 13px; color: var(--gn); }
.lead { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; margin-top: 16px; }
.lead .big { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.lead .big .tx { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.lead .big h1 { font-size: clamp(24px, 4vw, 34px); }
.lead .big p { margin: 0; color: var(--muted); }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row .pic { aspect-ratio: 4 / 3; border-radius: 6px; }
.row h3 { font-size: 16.5px; }
.row .meta { margin-top: 3px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card .tx { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-size: 18px; }
.card p { margin: 0; font-size: 14.5px; color: var(--muted); }
a.card:hover, a.row:hover { border-color: var(--gn); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 8px; }
.latest { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; align-self: start; }
.latest a { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.latest a:last-child { border-bottom: 0; }
.latest a i { font-style: normal; font-family: var(--head); color: var(--rd); min-width: 1.4em; }
.latest a:hover span { color: var(--rd); }

/* article */
.art { max-width: 760px; margin: 22px auto 0; }
.art h1 { font-size: clamp(26px, 5vw, 38px); margin: 10px 0; }
.art .by { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.art .pic { margin-top: 14px; border-radius: 12px; }
.art .cap { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.art .txt { font-size: 18px; line-height: 1.85; margin-top: 16px; }
.art .txt p { margin: 0 0 1em; }
.share { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.btn { border: 1px solid color-mix(in srgb, var(--gn) 40%, var(--line)); background: var(--surface); color: var(--gn); border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 600; }
.btn:hover { background: var(--tint); }
.btn.pri { background: linear-gradient(135deg, var(--rd), color-mix(in srgb, var(--rd) 72%, #000)); color: #fff; border: 0; }
.btn.gn { background: linear-gradient(135deg, var(--gn), color-mix(in srgb, var(--gn) 70%, #000)); color: #fff; border: 0; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.foot { margin-top: 34px; padding-top: 16px; border-top: 3px solid var(--rd); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* admin */
.admin { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box h2 { font-size: 18px; }
.box label { font-size: 12.5px; font-weight: 700; color: var(--gn); display: flex; flex-direction: column; gap: 3px; }
.box input[type=text], .box textarea, .box select { font: inherit; font-weight: 400; color: var(--fg); background: var(--tint); border: 1px solid transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gn) 18%, transparent); border-radius: 10px; padding: 7px 10px; width: 100%; }
.box textarea { min-height: 150px; resize: vertical; }
.box input:focus, .box textarea:focus, .box select:focus { outline: 2px solid var(--gn); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chks { display: flex; gap: 16px; flex-wrap: wrap; }
.chks label { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); font-weight: 600; }
.chks input { accent-color: var(--gn); width: 16px; height: 16px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; max-height: 420px; overflow: auto; }
.list .it { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.list .it span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .it button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.thumbp { max-width: 100%; max-height: 140px; border-radius: 8px; display: block; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
#amsg { font-size: 13px; min-height: 1.4em; color: var(--fg); margin: 0; }

.box input[type=password], .box input[type=search], .box input[type=datetime-local] { font: inherit; font-weight: 400; color: var(--fg); background: var(--tint); border: 1px solid transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gn) 18%, transparent); border-radius: 10px; padding: 7px 10px; width: 100%; }
.box input:disabled, .btn:disabled, .list button:disabled { opacity: .45; }
.login { max-width: 380px; margin: 26px auto; }

    $("apane").innerHTML = '<div class="box"><h2>সরাসরি প্রকাশ (এক ক্লিকে)</h2><p class="note">GitHub-এ আপলোড করা সাইট থেকে খুললে এখান থেকেই news.json আপডেট হয়ে যায়। ১-২ মিনিট পরে সবাই নতুন সংবাদ দেখে।</p>' +
      '<div class="two"><label>GitHub ইউজারনেম<input type="text" id="gO" value="' + esc(c.o) + '"></label><label>রিপোজিটরির নাম<input type="text" id="gR" value="' + esc(c.r) + '"></label></div>' +
      '<div class="two"><label>ব্রাঞ্চ<input type="text" id="gB" value="' + esc(c.b) + '"></label><label>ফাইলের নাম<input type="text" id="gP" value="' + esc(c.p) + '"></label></div>' +
      '<label>টোকেন (Personal access token)<input type="password" id="gT" value="' + esc(c.t || "") + '" autocomplete="off"></label>' +
      '<div class="chks"><label><input type="checkbox" id="gRem"' + (c.t || !ls(GH_KEY) ? " checked" : "") + '> এই ডিভাইসে মনে রাখুন</label></div>' +
      '<div class="acts"><button class="btn pri" id="gGo" type="button">এখনই প্রকাশ করুন</button></div>' +
      '<details><summary>টোকেন কীভাবে বানাবেন</summary><p class="note">GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token। Repository access: শুধু এই রিপোজিটরি। Permissions → Contents: Read and write। টোকেনটি কপি করে এখানে বসান। টোকেন কাউকে দেবেন না।</p></details></div>' +
      '<div class="box" style="margin-top:12px"><h2>হাতে করে (ফাইল দিয়ে)</h2><div class="acts"><button class="btn" id="aExport" type="button">news.json নামান</button><label class="btn" style="flex-direction:row;cursor:pointer">news.json খুলুন<input type="file" id="aImport" accept=".json,application/json" hidden></label><button class="btn" id="aLatest" type="button">সাইট থেকে সর্বশেষ আনুন</button></div><p class="note">নামানো ফাইলটি GitHub-এ একই নামে আপলোড করলেও একই কাজ হয়। “সাইট থেকে সর্বশেষ আনুন” চাপলে এই ব্রাউজারের অপ্রকাশিত পরিবর্তন বাদ যায়।</p></div>';
    $("gGo").onclick = function () {
      var cfg = { o: $("gO").value.trim(), r: $("gR").value.trim(), b: $("gB").value.trim() || "main", p: $("gP").value.trim() || "news.json", t: $("gT").value.trim() };
      if (!cfg.o || !cfg.r || !cfg.t) { msg("ইউজারনেম, রিপোজিটরি ও টোকেন লিখুন।"); return; }
      ls(GH_KEY, JSON.stringify($("gRem").checked ? cfg : { o: cfg.o, r: cfg.r, b: cfg.b, p: cfg.p }));
      msg("প্রকাশ হচ্ছে…"); $("gGo").disabled = true;
      ghPublish(cfg).then(function () { setDirty(false); msg("প্রকাশ হয়েছে ✓ ১-২ মিনিটে সাইটে দেখা যাবে।"); }, function (e) {
        var m = e && e.st === 401 ? "টোকেন ঠিক নয় বা মেয়াদ শেষ।" : e && (e.st === 403 || e.st === 404) ? "রিপোজিটরি/ব্রাঞ্চ ঠিক নয়, অথবা টোকেনে Contents: Read and write অনুমতি নেই।" : e && (e.st === 409 || e.st === 422) ? "ফাইল বদলে গেছে, আবার চেষ্টা করুন।" : "সরাসরি পাঠানো যায়নি। GitHub-এ আপলোড করা সাইট থেকে খুলে চেষ্টা করুন, নয়তো ফাইল নামিয়ে আপলোড করুন।";
        msg(m);
      }).then(function () { if ($("gGo")) $("gGo").disabled = false; });
    };
    $("aExport").onclick = function () { download("news.json", JSON.stringify(DB)); };
    $("aImport").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return; var r = new FileReader();
      r.onload = function () { try { var j = JSON.parse(r.result); if (!j.articles) throw 0; DB = j; if (!DB.cats) DB.cats = []; mark(); msg("news.json খোলা হয়েছে।"); } catch (x) { msg("এটি সঠিক news.json নয়।"); } };
      r.readAsText(f);
    };
    $("aLatest").onclick = function () {
      fetch("news.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) { if (!j.articles) throw 0; DB = j; DB.cats = DB.cats || []; DB.cats.forEach(function (c, i) { CATCOL[c.id] = palette(i); }); saveLocal(); setDirty(false); chrome(); msg("সর্বশেষ প্রকাশিত সংবাদ আনা হয়েছে।"); }, function () { msg("news.json আনা যায়নি।"); });
    };
  }

  /* ---------- shell ---------- */
  function chrome() {
    $("siteName").textContent = DB.site.name; $("siteTag").textContent = DB.site.tag || ""; $("logo").src = LOGO;
    $("footL").textContent = "© " + bn(new Date().getFullYear()) + " " + DB.site.name;
    document.title = DB.site.name;
    $("nav").innerHTML = '<a href="#home" data-r="home">প্রথম পাতা</a>' + DB.cats.map(function (c) { return '<a href="#c-' + esc(c.id) + '" data-r="c-' + esc(c.id) + '">' + esc(c.name) + "</a>"; }).join("") +
      '<form class="srch" id="sform"><input type="text" id="q" placeholder="খুঁজুন…" aria-label="খুঁজুন"></form>';
    $("sform").onsubmit = function (e) { e.preventDefault(); lastQ = $("q").value; if (location.hash === "#search") route(); else location.hash = "#search"; };
    var br = sorted().filter(function (a) { return a.breaking; }).slice(0, 8);
    $("tickerBox").innerHTML = br.length ? '<div class="ticker"><b>জরুরি</b><div class="run"><div class="track">' + br.map(function (a) { return '<a href="' + href(a) + '">' + esc(a.title) + "</a>"; }).join("") + "</div></div></div>" : "";
  }
  function route() {
    var h = (location.hash || "#home").slice(1), v = $("view");
    document.title = DB.site.name;
    if (h === "admin") { v.innerHTML = admin(); wireAdmin(); }
    else if (h === "search") v.innerHTML = searchView();
    else if (h.indexOf("c-") === 0) { v.innerHTML = catView(h.slice(2)); document.title = cat(h.slice(2)).name + " | " + DB.site.name; }
    else if (h.indexOf("a-") === 0) {
      v.innerHTML = article(h.slice(2));
      var sb = $("shareBtn"), fb = $("fbBtn");
      if (sb) sb.onclick = function () { var u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { sb.textContent = "কপি হয়েছে ✓"; }, function () { sb.textContent = u; }); };
      if (fb) fb.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(location.href.split("#")[0] + "#" + h);
    } else v.innerHTML = home();
    document.querySelectorAll("#nav a[data-r]").forEach(function (a) { a.classList.toggle("on", a.dataset.r === h || (h === "" && a.dataset.r === "home")); });
    scrollTo(0, 0);
  }
  function boot() {
    chrome(); route();
    window.addEventListener("hashchange", route);
    try { $("today").textContent = new Date().toLocaleDateString("bn-BD", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Dhaka" }); } catch (e) {}
    $("themeBtn").onclick = function () {
      var r = document.documentElement, dark = r.getAttribute("data-theme") === "dark" || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
      r.setAttribute("data-theme", dark ? "light" : "dark");
    };
  }
  load();
})();
</script>
